<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northeastern Economics · Course Scheduler</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#D01C28" />
    <script>
      // Apply the saved/system theme before first paint (no flash)
      try {
        var saved = JSON.parse(localStorage.getItem("econ-ui") || "{}").state;
        var t = saved && saved.theme;
        if (t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches))
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
