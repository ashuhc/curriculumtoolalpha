# Render Blueprint — free, no-expiry deployment of the whole app.
#
#   Database:  Neon free Postgres (neon.tech) — no expiry, no credit card.
#   Website:   one Render free web service built from ./Dockerfile (API + site on one URL).
#
# Render dashboard → New → Blueprint → pick this repository. You'll be prompted for:
#   DATABASE_URL    your Neon connection string (postgresql://…neon.tech/neondb?sslmode=require)
#   ADMIN_EMAIL     your first scheduler login
#   ADMIN_PASSWORD  a strong password for it
#
# Free web services sleep after 15 idle minutes (~1 minute to wake on the next visit).

services:
  - type: web
    name: econ-scheduler
    runtime: docker
    plan: free
    region: oregon                      # Neon's US West (Oregon) region is closest
    dockerfilePath: ./Dockerfile        # single container: API + website
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false                     # prompted: paste the Neon connection string
      - key: AUTH_SECRET
        generateValue: true             # random signing key for sign-in tokens
      - key: ADMIN_EMAIL
        sync: false                     # prompted
      - key: ADMIN_PASSWORD
        sync: false                     # prompted; use a strong password
      - key: SEED_DEMO_USERS
        value: "false"                  # never create the README demo accounts on a public site
      - key: REQUIRE_LOGIN
        value: "true"                   # department data is only visible after signing in
