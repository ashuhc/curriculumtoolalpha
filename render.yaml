# Render Blueprint — one-click deploy of the whole app.
# Render dashboard → New → Blueprint → pick this repository.
# You'll be asked for ADMIN_EMAIL and ADMIN_PASSWORD (your first scheduler login).
#
# Free plans: the web service sleeps after 15 idle minutes (~1 min to wake) and the
# free database expires after 30 days. Change both `plan:` values for real use.

databases:
  - name: econ-scheduler-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: econ_scheduler
    user: econ

services:
  - type: web
    name: econ-scheduler
    runtime: docker
    plan: free
    region: oregon                      # same region as the database
    dockerfilePath: ./Dockerfile        # single container: API + website
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: econ-scheduler-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true             # random signing key for sign-in tokens
      - key: ADMIN_EMAIL
        sync: false                     # prompted when you create the Blueprint
      - key: ADMIN_PASSWORD
        sync: false                     # prompted; use a strong password
      - key: SEED_DEMO_USERS
        value: "false"                  # never create the README demo accounts on a public site
      - key: REQUIRE_LOGIN
        value: "true"                   # department data is only visible after signing in
