# Full stack locally:   docker compose up --build      →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: econ
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-econ}
      POSTGRES_DB: econ_scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econ -d econ_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"   # host port 5433 avoids clashing with a local Postgres

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://econ:${POSTGRES_PASSWORD:-econ}@db:5432/econ_scheduler
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@northeastern.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-econpassword123}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""          # same origin; nginx proxies /api and /ws
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
